[package]
name = "verse-together-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fully native Rust scripture reader for Verse Together"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "advanced", "svg", "image-without-codecs", "markdown"] }
# Only PNG is needed for the app icon.
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
regex = "1"
webbrowser = "1"

[build-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[dev-dependencies]
iced_test = "0.14"

# Local fix for shadow clipping/damage in the pinned CPU renderer. See vendor/iced_tiny_skia/PATCH.md.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[package]
name = "verse-together-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fully native Rust scripture reader for Verse Together"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "advanced", "svg", "image-without-codecs", "markdown"] }
# PNG for the app icon; WebP for the website's lesson covers and journal art (pure Rust decoders).
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
regex = "1"
webbrowser = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
# HTTPS for account sign-in and sync (rustls; no OpenSSL).
ureq = { version = "3", features = ["json"] }
# The account session lives in the OS credential store: Secret Service (GNOME Keyring/KWallet), macOS Keychain,
# Windows Credential Manager. Pure-Rust D-Bus on Linux, so no libdbus is needed.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.12", default-features = false }

[build-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[dev-dependencies]
iced_test = "0.14"

# Local fix for shadow clipping/damage in the pinned CPU renderer. See vendor/iced_tiny_skia/PATCH.md.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[package]
name = "verse-together-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
